# ============================================================
# Nginx 反向代理配置
# 放路径：nginx/default.conf
# ============================================================

server {
    listen 80;
    # 改成你的域名，没域名就写服务器 IP
    server_name your-domain.com www.your-domain.com _;

    # 日志（方便排查问题）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --------------------------------------------------------
    # 1. 前端静态文件（React 打包后的 dist 目录）
    # --------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;

        # React 是 SPA，必须这段，否则刷新页面会 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（图片、字体、CSS、JS 缓存 1 年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩（让网页加载更快）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/wasm image/svg+xml;

    # --------------------------------------------------------
    # 2. 后端 API 反向代理
    #    前端调用：http://your-domain.com/api/users
    #    实际转给：http://backend:3000/users
    # --------------------------------------------------------
    location /api/ {
        # 注意：proxy_pass 末尾的 / 会把 /api/ 去掉
        proxy_pass         http://backend:3000/;
        proxy_http_version 1.1;

        # WebSocket 支持（如果后端有的话）
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # 透传真实信息给后端
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不缓存 API 响应
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------
    # 3. 健康检查端点（可选，负载均衡器会用到）
    # --------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
