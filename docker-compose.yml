# ============================================================
# Docker Compose 配置 · 全栈项目生产部署
# 适用：React + Node.js + MySQL + Redis，单台轻量服务器
# ============================================================

services:
  # ----------------------------------------------------------
  # Nginx：大门，反向代理 + 静态文件服务
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine                # 镜像：精简版 nginx
    container_name: myapp-nginx
    ports:
      - "80:80"                        # 对外暴露 80（HTTP）
       # - "443:443"                    # 配 HTTPS 时再开
      - "443:443"                      # 对外暴露 443（HTTPS）
    volumes:
      # Nginx 配置
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端打包好的静态文件
      # ⚠️ Vite 是 dist/，CRA 是 build/，Next.js 是 out/，按你的框架改
      - ./frontend/build:/usr/share/nginx/html:ro
      # 【2026-08-01 改】Certbot 验证用：Certbot 在这里放验证文件，nginx 服务 /.well-known/acme-challenge/
      - /var/www/certbot:/var/www/certbot:ro
      # 【2026-08-01 改】SSL 证书目录：Certbot 生成的证书
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy     # 等后端健康检查通过再启动
    restart: unless-stopped
    networks:
      - app-net
    # 轻量服务器必须限内存！不然 nginx 吃多了会拖死别的服务
    deploy:
      resources:
        limits:
          memory: 128M

  # ----------------------------------------------------------
  # Backend：Node.js 后端服务
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend               # 在 backend 目录找 Dockerfile
      dockerfile: Dockerfile
    container_name: myapp-backend
    expose:
      - "8000"                         # 只暴露给同网络的其他容器，不开公网
          # 【2026-08-01 改】环境变量改用 env_file 加载，不再在 compose 里重复写
    # 原因：原来 compose 里 hardcode 的 DB_USER=admin、DB_PASSWORD=123456 跟
    #       backend/.env.production 里的 myapp_user 不一致，会导致连不上数据库
    env_file:
      - ./backend/.env.production
    depends_on:
      - mysql                          # 等数据库起来
      - redis                          # 等 redis 起来
    volumes:
      # 上传的图片要持久化，否则容器重启就丢了
      - ./backend/uploads:/app/uploads
    restart: unless-stopped
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M                 # 后端是内存大户，限一下
    # 健康检查：用已存在的 /api/blogs/count 接口（无需鉴权）
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/api/blogs/count"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # MySQL：数据库
  # ----------------------------------------------------------
  mysql:
    # 轻量服务器推荐用 mariadb，比 mysql 8 省内存
    # 两者用法 99% 兼容，放心用
    image: mariadb:10.11
    container_name: myapp-mysql
    # 注意：这里故意不写 ports！不暴露到公网
    environment:
      - MARIADB_ROOT_PASSWORD=852456Aa
      - MARIADB_DATABASE=blog
      - MARIADB_USER=myapp_user
      - MARIADB_PASSWORD=852456Aa
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql      # 数据持久化（关键！不写这行数据会丢）
      # 【2026-08-01 改】挂载 init SQL，MariaDB 首次启动（数据卷为空时）自动执行
      # 文件名 01- 前缀保证执行顺序，:ro 只读挂载
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
      - --innodb-buffer-pool-size=256M # 限制 InnoDB 内存，2G 机器建议 256M
    restart: unless-stopped
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------
  # Redis：缓存
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine              # alpine 版本只有十几 MB
    container_name: myapp-redis
    # 也不暴露公网
     # 【2026-08-01 改】去掉密码要求（--requirepass）
    # 原因：原版用 ${REDIS_PASSWORD} 引用，但 web/.env 里没定义这个变量，会变成空字符串
    #       Redis 只在 docker 内网访问，不暴露公网，学习项目可以不要密码
    #       真要加密码，可以直接改成 --requirepass your_password_here
    command:
      - redis-server
      # - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 128mb              # 限制最大内存
      - --maxmemory-policy allkeys-lru # 满了之后淘汰策略
    volumes:
      - redis_data:/data               # 数据持久化
    restart: unless-stopped
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 160M

# ============================================================
# 网络：所有服务在一个局域网里，互相能访问
# ============================================================
networks:
  app-net:
    driver: bridge

# ============================================================
# 命名卷：数据持久化用，删容器数据不丢
# ============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
