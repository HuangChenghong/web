# ============================================================
# Docker Compose 配置 · 全栈项目生产部署
# 适用：React + Node.js + MySQL + Redis，单台轻量服务器
# ============================================================

services:
  # ----------------------------------------------------------
  # Nginx：大门，反向代理 + 静态文件服务
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine                # 镜像：精简版 nginx
    container_name: myapp-nginx
    ports:
      - "80:80"                        # 对外暴露 80（HTTP）
      # - "443:443"                    # 配 HTTPS 时再开
    volumes:
      # Nginx 配置
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # 前端打包好的静态文件
      # ⚠️ Vite 是 dist/，CRA 是 build/，Next.js 是 out/，按你的框架改
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend                        # 等后端起来再启动
    restart: unless-stopped
    networks:
      - app-net
    # 轻量服务器必须限内存！不然 nginx 吃多了会拖死别的服务
    deploy:
      resources:
        limits:
          memory: 128M

  # ----------------------------------------------------------
  # Backend：Node.js 后端服务
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend               # 在 backend 目录找 Dockerfile
      dockerfile: Dockerfile
    container_name: myapp-backend
    expose:
      - "3000"                         # 只暴露给同网络的其他容器，不开公网
    environment:
      - NODE_ENV=production
      - PORT=3000
      # 数据库（注意：主机名是服务名 mysql，不是 localhost）
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # 你自己的其他配置
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      - mysql                          # 等数据库起来
      - redis                          # 等 redis 起来
    restart: unless-stopped
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M                 # 后端是内存大户，限一下
    # 健康检查（可选但推荐）
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ----------------------------------------------------------
  # MySQL：数据库
  # ----------------------------------------------------------
  mysql:
    # 轻量服务器推荐用 mariadb，比 mysql 8 省内存
    # 两者用法 99% 兼容，放心用
    image: mariadb:10.11
    container_name: myapp-mysql
    # 注意：这里故意不写 ports！不暴露到公网
    environment:
      - MARIADB_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MARIADB_DATABASE=${DB_NAME}
      - MARIADB_USER=${DB_USER}
      - MARIADB_PASSWORD=${DB_PASSWORD}
      - TZ=Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql      # 数据持久化（关键！不写这行数据会丢）
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=100
      - --innodb-buffer-pool-size=256M # 限制 InnoDB 内存，2G 机器建议 256M
    restart: unless-stopped
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ----------------------------------------------------------
  # Redis：缓存
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine              # alpine 版本只有十几 MB
    container_name: myapp-redis
    # 也不暴露公网
    command:
      - redis-server
      - --requirepass ${REDIS_PASSWORD}
      - --maxmemory 128mb              # 限制最大内存
      - --maxmemory-policy allkeys-lru # 满了之后淘汰策略
    volumes:
      - redis_data:/data               # 数据持久化
    restart: unless-stopped
    networks:
      - app-net
    deploy:
      resources:
        limits:
          memory: 160M

# ============================================================
# 网络：所有服务在一个局域网里，互相能访问
# ============================================================
networks:
  app-net:
    driver: bridge

# ============================================================
# 命名卷：数据持久化用，删容器数据不丢
# ============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
