# ============================================================
# Nginx 反向代理配置
# 放路径：nginx/default.conf
# ============================================================

# **主 nginx 配置**：跑在最外层，对外提供 80 端口服务，同时干两件事：
# - 直接 serve 前端静态文件（前端 build 产物）
# - 反代 `/api/*` 到后端容器 8000 端口

# 【2026-08-01 改】加 resolver 指令
# 原因：用 set 变量 + proxy_pass $variable 形式时，nginx 不会用系统 /etc/resolv.conf
#       必须显式声明 resolver。127.0.0.11 是 docker 内置 DNS，每个容器都自动配了
#       valid=10s 是 DNS 缓存 10 秒
#       没有这行 → "no resolver defined to resolve myapp-backend" 错误 → 502
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;  #监听80端口
    # 改成你的域名，没域名就写服务器 IP  # 匹配这两个域名发来的请求
    server_name hch359.top www.hch359.top _;

    # 上传文件大小限制（multer 默认 1MB 可能太小）
    client_max_body_size 50M;

    # 日志（方便排查问题）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --------------------------------------------------------
    # 1. 前端静态文件（React 打包后的 build 目录）
    # --------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # React 是 SPA，必须这段，否则刷新页面会 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（图片、字体、CSS、JS 缓存 1 年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩（让网页加载更快）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/wasm image/svg+xml;

    # --------------------------------------------------------
    # 2. 后端 API 反向代理
    #    前端调用：http://your-domain.com/api/users
    #    实际转给：http://backend:8000/api/users
    #    用 set $backend_upstream 变量绕开 nginx 启动期 host 解析
    # --------------------------------------------------------
    location /api/ {
        # 【2026-08-01 改】用容器名 myapp-backend 代替服务名 backend
        # 原因：你的 docker-compose.yml 里 backend service 设置了 container_name: myapp-backend
        #       docker 内部 DNS 对设置了 container_name 的 service 名解析有时不可靠，用容器名最稳
        set $backend_upstream http://myapp-backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        # 【2026-08-01 改】删掉 Upgrade/Connection "upgrade" header
        # 原因：原来 hardcode Connection: upgrade，普通 HTTP 请求发到 backend 会被误认为 WebSocket 协议
        #       backend 进程可能因此 hang 或返回异常，nginx 收到响应超时/异常 → 502
        #       如果以后真要 WebSocket 支持，应该用 map 动态设置（普通请求 close，WebSocket 请求 upgrade）
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --------------------------------------------------------
    # 2.5 上传文件代理
    # --------------------------------------------------------
    location /uploads/ {
        set $backend_upstream http://myapp-backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        access_log off;
    }

    # --------------------------------------------------------
    # 3. 健康检查端点
    # --------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
