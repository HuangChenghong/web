# ============================================================
# Nginx 反向代理配置
# 放路径：nginx/default.conf
# ============================================================

# **主 nginx 配置**：跑在最外层，对外提供 80 端口服务，同时干两件事：
# - 直接 serve 前端静态文件（前端 build 产物）
# - 反代 `/api/*` 到后端容器 8000 端口

# 【2026-08-01 改】加 resolver 指令，用 docker 内置 DNS（127.0.0.11）
# 原因：nginx 1.27+ 启动时会预解析 upstream 的 host 并尝试 TCP 连，连不上就 fatal error 退出
# 加上 resolver + resolve 参数后，nginx 改为运行时动态解析，不会被启动时检查卡死
resolver 127.0.0.11 valid=10s ipv6=off;

# 上游：后端 Node.js 服务
upstream backend {
    # 【2026-08-01 改】server 末尾加 resolve 参数，告诉 nginx 这个 host 要运行时动态解析
    server backend:8000 resolve;  # 服务名:端口，对应 docker-compose 里的 backend 服务
}

server {
    listen 80;  #监听80端口
    # 改成你的域名，没域名就写服务器 IP  # 匹配这两个域名发来的请求
    server_name hch359.top www.hch359.top _;

    # 上传文件大小限制（multer 默认 1MB 可能太小）
    client_max_body_size 50M;

    # 日志（方便排查问题）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --------------------------------------------------------
    # 1. 前端静态文件（React 打包后的 dist 目录）
    # --------------------------------------------------------
    location / {  #匹配 所有根路径请求（比如 http://域名/、http://域名/home 这类请求）
        root   /usr/share/nginx/html; #静态文件目录  访问 /xxx 时，会去 /usr/share/nginx/html/xxx 查找文件
        index  index.html;    #默认主页文件，访问目录时优先加载 index.html

        # React 是 SPA，必须这段，否则刷新页面会 404
        # 先尝试直接匹配真实文件 $uri
        # 再尝试匹配文件夹 $uri/
        # 找不到就统一返回 /index.html
        #解决 React 路由跳转后刷新页面出现 404 的经典问题，让前端路由由前端 JS 接管，而不是 Nginx 去查找真实文件
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（图片、字体、CSS、JS 缓存 1 年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩（让网页加载更快）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/wasm image/svg+xml;

    # --------------------------------------------------------
    # 2. 后端 API 反向代理
    #    前端调用：http://your-domain.com/api/users
    #    实际转给：http://backend:3000/users
    # --------------------------------------------------------
    location /api/ {
        # ⚠️ proxy_pass 末尾不带 / ！保留 /api/ 前缀原样转发给后端
        # （后端 app.js 注册的是 app.use('/api/blogs', ...)，需要 /api 前缀）
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;   #使用 HTTP/1.1 版本转发请求，适配长连接、WebSocket 等现代用法

        # WebSocket 支持（如果后端有的话）
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # 透传真实信息给后端
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不缓存 API 响应
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------
    # 2.5 上传文件代理
    #    前端 <img src="/uploads/xxx.png"> 需要转给后端静态服务
    #    （后端 app.js 里有 app.use('/uploads', express.static(...))）
    # --------------------------------------------------------
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        access_log off;
    }

    # --------------------------------------------------------
    # 3. 健康检查端点（可选，负载均衡器会用到）
    # --------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
