# ============================================================
# Nginx 反向代理配置
# 放路径：nginx/default.conf
# ============================================================

server {
    listen 80;  #监听80端口
    # 改成你的域名，没域名就写服务器 IP  # 匹配这两个域名发来的请求
    server_name your-domain.com www.your-domain.com _;

    # 日志（方便排查问题）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --------------------------------------------------------
    # 1. 前端静态文件（React 打包后的 dist 目录）
    # --------------------------------------------------------
    location / {  #匹配 所有根路径请求（比如 http://域名/、http://域名/home 这类请求）
        root   /usr/share/nginx/html; #静态文件目录  访问 /xxx 时，会去 /usr/share/nginx/html/xxx 查找文件
        index  index.html;    #默认主页文件，访问目录时优先加载 index.html

        # React 是 SPA，必须这段，否则刷新页面会 404
        # 先尝试直接匹配真实文件 $uri
        # 再尝试匹配文件夹 $uri/
        # 找不到就统一返回 /index.html
        #解决 React 路由跳转后刷新页面出现 404 的经典问题，让前端路由由前端 JS 接管，而不是 Nginx 去查找真实文件
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（图片、字体、CSS、JS 缓存 1 年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩（让网页加载更快）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/wasm image/svg+xml;

    # --------------------------------------------------------
    # 2. 后端 API 反向代理
    #    前端调用：http://your-domain.com/api/users
    #    实际转给：http://backend:3000/users
    # --------------------------------------------------------
    location /api/ {
        # 注意：proxy_pass 末尾的 / 会把 /api/ 去掉
        proxy_pass         http://backend:3000/;  #backend:3000：可以是容器服务名、本机地址 127.0.0.1:3000 或真实后端 IP 端口
        proxy_http_version 1.1;   #使用 HTTP/1.1 版本转发请求，适配长连接、WebSocket 等现代用法

        # WebSocket 支持（如果后端有的话）
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        # 透传真实信息给后端
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # 不缓存 API 响应
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------
    # 3. 健康检查端点（可选，负载均衡器会用到）
    # --------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
