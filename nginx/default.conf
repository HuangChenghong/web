# ============================================================
# Nginx 反向代理配置（含 HTTPS，2026-08-01 改）
# 放路径：nginx/default.conf
# ============================================================

# 【2026-08-01 改】resolver 指令：set 变量形式必须显式声明 resolver
# 127.0.0.11 是 docker 内置 DNS，每个容器都自动配了
resolver 127.0.0.11 valid=10s ipv6=off;

# ============================================================
# 80 端口：HTTP 全部重定向到 HTTPS
# 只有 /.well-known/acme-challenge/ 例外（Certbot 验证用）
# ============================================================
server {
    listen 80;
    server_name hch359.top www.hch359.top;

    # Certbot 验证用，必须保留，否则申请证书会失败
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部强制 https（301 永久重定向）
    location / {
        return 301 https://$host$request_uri;
    }
}

# ============================================================
# 443 端口：HTTPS 真正服务
# ============================================================
server {
    listen 443 ssl;
    server_name hch359.top www.hch359.top;

    # ---- SSL 证书（Certbot 生成在 /etc/letsencrypt/live/）----
    ssl_certificate /etc/letsencrypt/live/hch359.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hch359.top/privkey.pem;

    # ---- SSL 配置（强加密 + 现代协议）----
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS：告诉浏览器"永远用 HTTPS 访问这个域名"
    # max-age=31536000 = 1 年
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 上传文件大小限制（multer 默认 1MB 可能太小）
    client_max_body_size 50M;

    # 日志（方便排查问题）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --------------------------------------------------------
    # 1. 前端静态文件（React 打包后的 build 目录）
    # --------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # React 是 SPA，必须这段，否则刷新页面会 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（图片、字体、CSS、JS 缓存 1 年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩（让网页加载更快）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/wasm image/svg+xml;

    # --------------------------------------------------------
    # 2. 后端 API 反向代理
    # --------------------------------------------------------
    location /api/ {
        set $backend_upstream http://myapp-backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # --------------------------------------------------------
    # 3. 上传文件代理
    # --------------------------------------------------------
    location /uploads/ {
        set $backend_upstream http://myapp-backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        access_log off;
    }

    # --------------------------------------------------------
    # 4. 健康检查
    # --------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
