# ============================================================
# Nginx 反向代理配置
# 放路径：nginx/default.conf
# ============================================================

# **主 nginx 配置**：跑在最外层，对外提供 80 端口服务，同时干两件事：
# - 直接 serve 前端静态文件（前端 build 产物）
# - 反代 `/api/*` 到后端容器 8000 端口

# 【2026-08-01 改】不用 upstream 块，用 set 变量 + proxy_pass 绕开 nginx 1.27+ 启动期连接检查
# 原因：upstream 块会让 nginx 启动时强制解析 host 并 TCP 连，连不上就 fatal error 退出
# 用 set 变量后，nginx 只在收到请求时才解析 host，绕开启动期检查

server {
    listen 80;  #监听80端口
    # 改成你的域名，没域名就写服务器 IP  # 匹配这两个域名发来的请求
    server_name hch359.top www.hch359.top _;

    # 上传文件大小限制（multer 默认 1MB 可能太小）
    client_max_body_size 50M;

    # 日志（方便排查问题）
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    # --------------------------------------------------------
    # 1. 前端静态文件（React 打包后的 build 目录）
    # --------------------------------------------------------
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        # React 是 SPA，必须这段，否则刷新页面会 404
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存（图片、字体、CSS、JS 缓存 1 年）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        root   /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩（让网页加载更快）
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/wasm image/svg+xml;

    # --------------------------------------------------------
    # 2. 后端 API 反向代理
    #    前端调用：http://your-domain.com/api/users
    #    实际转给：http://backend:8000/api/users
    #    用 set $backend_upstream 变量绕开 nginx 启动期 host 解析
    # --------------------------------------------------------
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 30s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
        proxy_cache_bypass $http_upgrade;
    }

    # --------------------------------------------------------
    # 2.5 上传文件代理
    # --------------------------------------------------------
    location /uploads/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        access_log off;
    }

    # --------------------------------------------------------
    # 3. 健康检查端点
    # --------------------------------------------------------
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
